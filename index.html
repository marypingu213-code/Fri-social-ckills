<style>

:root{--bg:#F5F6F4;--ink:#23282B;--soft:#5B6469;--line:#D8DCDA;--card:#FFF;--a:#3E6690;--a-bg:#EAF0F5;--b:#3E8272;--b-bg:#E9F4F0}

#unitA{background:var(--a-bg)}#unitB{background:var(--b-bg)}.top{height:9vh;display:flex;align-items:center;justify-content:space-between;padding:1.8vh 3.4vw}.top-left{display:flex;align-items:center;gap:1vw}.back,.full{font-size:1.3vw;background:#fff;border:1px solid var(--line);border-radius:5px;padding:.8vh 1.3vw;cursor:pointer}.count{font-size:1.3vw;color:var(--soft)}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:1vh 5vw}.slide{display:none;width:100%;max-width:74vw}.slide.active{display:block}.kicker{font-size:1.45vw;font-weight:700;margin:0 0 1vh}.title{font-size:3.5vw;line-height:1.2;font-weight:900;margin:0 0 2vh}.sub{font-size:1.8vw;color:var(--soft);line-height:1.45}.points{margin:0;padding:0;list-style:none;display:grid;gap:1.4vh}.points li{font-size:1.9vw;line-height:1.5;padding-left:1.6vw;position:relative}.points li:before{content:'';position:absolute;left:0;top:.7em;width:.8vw;height:3px;background:currentColor}.frame{margin-top:2.5vh;background:#fff;border:1px solid var(--line);border-radius:8px;padding:1.8vh 1.8vw;font-size:1.75vw;line-height:1.5}.chips{display:flex;flex-wrap:wrap;gap:1vw;margin-top:1vh}.chip{background:#fff;border:2px solid var(--line);border-radius:10px;padding:1.5vh 1.6vw;font-size:1.7vw;font-weight:700}.choice{background:#fff;border:1px solid var(--line);border-radius:8px;padding:1.5vh 1.6vw;margin:1vh 0;font-size:1.65vw;line-height:1.5}.cause{display:grid;gap:1vh}.cause div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:1.4vh 1.5vw;font-size:1.7vw}
.traffic-wrap{max-width:68vw;margin:0 auto;text-align:center}.traffic-scene{font-size:1.45vw;font-weight:700;color:var(--b);margin-bottom:1.2vh}.traffic-sentence{background:#fff;border:2px solid #cfd8d4;border-radius:14px;padding:2.5vh 2.2vw;font-size:2.25vw;font-weight:900;line-height:1.45;margin-bottom:2vh}.traffic-question{font-size:1.55vw;font-weight:700;margin-bottom:1.5vh}.traffic-buttons{display:flex;justify-content:center;gap:2vw}.traffic-btn{width:15vw;min-height:13vh;border:3px solid transparent;border-radius:18px;background:#fff;font-size:1.45vw;font-weight:900;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.07);transition:.15s}.traffic-btn:hover{transform:translateY(-2px)}.traffic-btn .face{display:block;font-size:3.6vw;line-height:1.05;margin-bottom:.6vh}.traffic-btn.green{border-color:#49A46D}.traffic-btn.red{border-color:#D95C5C}.traffic-feedback{min-height:7vh;margin-top:1.7vh;padding:1.3vh 1.5vw;border-radius:12px;font-size:1.45vw;font-weight:700;line-height:1.45}.traffic-feedback.good{background:#E8F6ED;color:#25623D}.traffic-feedback.bad{background:#FCECEC;color:#8A3434}.traffic-feedback.try{background:#FFF4D9;color:#785B16}.video-slide{max-width:76vw}.video{width:min(76vw,calc((100vh - 31vh)*16/9));max-width:100%;aspect-ratio:16/9;margin:1.2vh auto 0;background:#000;border-radius:9px;overflow:hidden}.video iframe{width:100%;height:100%;border:0}.note{text-align:center;font-size:1vw;color:var(--soft);margin-top:.5vh}.nav{height:11vh;display:flex;align-items:center;justify-content:center;gap:2vw}.nav button{font-size:1.4vw;font-weight:700;border:0;border-radius:6px;padding:1.1vh 2.3vw;color:#fff;cursor:pointer}.nav button:disabled{background:var(--line)!important;color:var(--soft)}.dots{display:flex;gap:.6vw}.dot{width:.65vw;height:.65vw;border-radius:50%;background:var(--line)}.dot.on{background:currentColor}

<script>
function toggleFull(){if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(function(){});}else{document.exitFullscreen();}}
function backHome(){document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});document.getElementById('lobby').classList.add('active');}
var units=[
 {id:'A',color:'var(--a)',title:'勇於說出自己的想法',range:'共6堂',on:true},
 {id:'B',color:'var(--b)',title:'讓教室變好的力量',range:'共6堂',on:true},
 {id:'C',color:'#A97A2C',title:'給予同儕積極正向的建議',range:'共6堂',on:false},
 {id:'D',color:'#6E5C93',title:'培養同理心',range:'共6堂',on:false},
 {id:'E',color:'#A85842',title:'遇到事情先思考再批判',range:'共6堂',on:false}
];
units.forEach(function(u){var b=document.createElement('button');b.className='door';b.style.setProperty('--door-color',u.color);b.disabled=!u.on;b.innerHTML='<div class="door-letter">'+u.id+'</div><div class="door-title">'+u.title+'</div><div class="door-status">'+(u.on?'':'製作中')+'</div><div class="door-range">'+u.range+'</div>';if(u.on){b.onclick=function(){openUnit(u.id);};}document.getElementById('doors').appendChild(b);});
</script>

var pos={A:0,B:0};
function openUnit(id){document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});document.getElementById('unit'+id).classList.add('active');pos[id]=0;render(id);}
function render(id){var list=id==='A'?slidesA:slidesB;var color=id==='A'?'var(--a)':'var(--b)';var stage=document.getElementById('stage'+id);stage.innerHTML='';list.forEach(function(x,i){var d=document.createElement('div');d.className='slide'+(i===pos[id]?' active':'')+(x.video?' video-slide':'');var html='<p class="kicker" style="color:'+color+'">'+x.k+'</p><h1 class="title">'+x.t+'</h1>';if(x.video){html+='<p class="sub">'+x.s+'</p><div class="video"><iframe src="https://www.youtube.com/embed/'+x.video+'?rel=0" title="'+x.t+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="note">▶ 直接在簡報中播放影片</div>';}else if(x.traffic){html+='<div class="traffic-wrap"><div class="traffic-scene">📍 情境：'+x.traffic.scene+'</div><div class="traffic-sentence">'+x.traffic.sentence+'</div><div class="traffic-question">這句話要亮哪一個燈？</div><div class="traffic-buttons"><button class="traffic-btn green" onclick="checkTraffic(this,\'green\',\''+x.traffic.answer+'\',\''+x.traffic.why.replace(/'/g,"\\'")+'\')"><span class="face">😊</span>🟢 綠燈<br>好句子</button><button class="traffic-btn red" onclick="checkTraffic(this,\'red\',\''+x.traffic.answer+'\',\''+x.traffic.why.replace(/'/g,"\\'")+'\')"><span class="face">😣</span>🔴 紅燈<br>壞句子</button></div><div class="traffic-feedback" id="trafficFeedback"></div></div>';}else if(x.c){x.c.forEach(function(q){html+='<div class="choice"><strong>情境：</strong>'+q[0]+'<br>🅰️ '+q[1]+'<br>🅱️ '+q[2]+'</div>';});html+='<div class="frame">想一想：哪一個選擇比較能幫助大家學習？</div>';}else if(x.chips){html+='<div class="chips">';x.chips.forEach(function(ch){html+='<div class="chip">'+ch+'</div>';});html+='</div><div class="frame">'+x.f+'</div>';}else if(x.cause){html+='<div class="cause">';x.cause.forEach(function(row){html+='<div>'+row+'</div>';});html+='</div>';}else{if(x.p){html+='<ul class="points" style="color:'+color+'">';x.p.forEach(function(p){html+='<li>'+p+'</li>';});html+='</ul>';}if(x.f){html+='<div class="frame">'+x.f+'</div>';}}d.innerHTML=html;stage.appendChild(d);});document.getElementById('count'+id).textContent=(pos[id]+1)+' / '+list.length;document.getElementById('prev'+id).disabled=pos[id]===0;document.getElementById('next'+id).disabled=pos[id]===list.length-1;var dots=document.getElementById('dots'+id);dots.innerHTML='';list.forEach(function(_,i){var dot=document.createElement('span');dot.className='dot'+(i===pos[id]?' on':'');dots.appendChild(dot);});}
function checkTraffic(btn,choice,answer,why){var box=btn.closest('.traffic-wrap');var fb=box.querySelector('.traffic-feedback');if(choice===answer){fb.className='traffic-feedback '+(answer==='green'?'good':'bad');fb.innerHTML=(answer==='green'?'😊 答對了！這是綠燈好句子。':'😣 答對了！這是紅燈壞句子。')+'<br>'+why;}else{fb.className='traffic-feedback try';fb.innerHTML='🤔 再想一想：這句話會讓別人有什麼感覺？';}}
function move(id,dir){var list=id==='A'?slidesA:slidesB;var n=pos[id]+dir;if(n<0||n>=list.length)return;pos[id]=n;render(id);}
document.addEventListener('keydown',function(e){var active=document.querySelector('.view.active');if(!active||active.id==='lobby')return;var id=active.id.slice(-1);if(e.key==='ArrowRight')move(id,1);if(e.key==='ArrowLeft')move(id,-1);if(e.key==='Escape')backHome();});
window.addEventListener('resize',function(){var active=document.querySelector('.view.active');if(active&&active.id!=='lobby')render(active.id);});
