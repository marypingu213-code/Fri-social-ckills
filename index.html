<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社會技巧教室</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
:root{--bg:#F5F6F4;--ink:#23282B;--soft:#5B6469;--line:#D8DCDA;--card:#FFF;--a:#3E6690;--a-bg:#EAF0F5;--b:#3E8272;--b-bg:#E9F4F0}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;overflow:hidden}button{font-family:inherit}#app{width:100vw;height:100vh;position:relative}.view{position:absolute;inset:0;display:none;flex-direction:column}.view.active{display:flex}
#lobby{padding:5vh 6vw;justify-content:center;gap:4vh}.lobby-eyebrow{font-size:1.5vw;color:var(--soft);margin:0 0 .8vh}.lobby-title{font-size:4.4vw;font-weight:900;margin:0}.doors{display:flex;gap:1.6vw}.door{flex:1;background:var(--card);border:1px solid var(--line);border-left:.6vw solid var(--door-color);border-radius:8px;padding:2.6vh 1.6vw;display:flex;flex-direction:column;gap:1.4vh;cursor:pointer;text-align:left}.door:disabled{cursor:default;opacity:.55}.door-letter{font-size:3.6vw;font-weight:900;color:var(--door-color);line-height:1}.door-title{font-size:1.8vw;font-weight:700;line-height:1.35}.door-range,.door-status{font-size:1.25vw;color:var(--soft)}.door-range{margin-top:auto}
#unitA{background:var(--a-bg)}#unitB{background:var(--b-bg)}.slide-topbar{display:flex;align-items:center;justify-content:space-between;padding:2.6vh 3.4vw 0}.back-btn,.fullscreen-btn{font-size:1.3vw;background:none;border:1px solid var(--line);border-radius:5px;padding:.8vh 1.4vw;cursor:pointer}.back-btn{border-color:currentColor}.topbar-right{display:flex;align-items:center;gap:1.4vw}.slide-counter{font-size:1.3vw;color:var(--soft)}
.slide-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:2vh 5vw 2vh;overflow:hidden}.slide{display:none;width:100%;max-width:72vw}.slide.active{display:block}.slide-kicker{font-size:1.5vw;font-weight:700;margin:0 0 1.2vh}.slide-title{font-size:3.5vw;font-weight:900;line-height:1.25;margin:0 0 2vh}.unit-cover .slide-title{font-size:4.4vw}.slide-sub{font-size:1.8vw;color:var(--soft);line-height:1.45;margin:0}.video-slide{max-width:76vw}.video-wrap{margin:1.5vh auto 0;background:#000;border-radius:10px;overflow:hidden;width:min(76vw,calc((100vh - 34vh)*16/9));max-width:100%;aspect-ratio:16/9;box-shadow:0 8px 28px rgba(35,40,43,.12)}.video-wrap iframe{width:100%;height:100%;border:0;display:block}.video-note{margin-top:.7vh;font-size:1.05vw;color:var(--soft);text-align:center}.slide-points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.8vh}.slide-points li{font-size:1.95vw;line-height:1.5;padding-left:1.8vw;position:relative}.slide-points li:before{content:'';position:absolute;left:0;top:.72em;width:.9vw;height:3px;background:currentColor}.slide-frame{margin-top:3vh;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2vh 2vw;font-size:1.8vw;line-height:1.55}.choice-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1.8vh 2vw;margin:1.2vh 0;font-size:1.75vw;line-height:1.5}.choice-card strong{color:currentColor}.highlight{font-size:2.4vw;font-weight:900;margin:1vh 0 2vh}.cause-grid{display:grid;grid-template-columns:1fr;gap:.8vh}.cause-row{display:flex;align-items:center;gap:1vw;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:1.3vh 1.5vw;font-size:1.7vw}.cause-row .arrow{font-weight:900;font-size:1.8vw}.slide-nav{display:flex;align-items:center;justify-content:center;gap:2vw;padding-bottom:3vh}.nav-btn{font-size:1.5vw;font-weight:700;color:#fff;border:0;border-radius:6px;padding:1.2vh 2.4vw;cursor:pointer}.nav-btn:disabled{background:var(--line)!important;color:var(--soft)}.dots{display:flex;gap:.6vw}.dot{width:.7vw;height:.7vw;border-radius:50%;background:var(--line)}.dot.current{background:currentColor}
@media(max-width:900px){.lobby{padding:4vh 5vw}.lobby-title{font-size:7vw}.doors{flex-wrap:wrap}.door{min-width:28vw}.door-letter{font-size:6vw}.door-title{font-size:3vw}.door-range,.door-status{font-size:2.2vw}.slide-title{font-size:6vw}.unit-cover .slide-title{font-size:7vw}.slide-kicker{font-size:3vw}.slide-sub,.slide-frame,.choice-card{font-size:3vw}.slide-points li{font-size:3.2vw}.video-wrap{width:min(90vw,calc((100vh - 30vh)*16/9))}.video-note{font-size:2.2vw}.nav-btn,.back-btn,.fullscreen-btn,.slide-counter{font-size:2.5vw}.cause-row{font-size:2.8vw}.highlight{font-size:4vw}}
</style>
</head>
<body>
<div id="app">
<div id="lobby" class="view active">
  <div><p class="lobby-eyebrow">社會技巧課程</p><h1 class="lobby-title">選擇今天要上的單元</h1></div>
  <div class="doors" id="doors"></div>
  <button class="fullscreen-btn" style="position:absolute;top:2.6vh;right:3.4vw" onclick="toggleFullscreen()">⛶ 全螢幕</button>
</div>
<div id="unitA" class="view"><div class="slide-topbar"><button class="back-btn" style="color:var(--a)" onclick="goLobby()">← 回大廳</button><div class="topbar-right"><span class="slide-counter" id="counterA"></span><button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ 全螢幕</button></div></div><div class="slide-stage" id="stageA"></div><div class="slide-nav"><button class="nav-btn" style="background:var(--a)" id="prevA" onclick="changeSlide('A',-1)">上一頁</button><div class="dots" id="dotsA" style="color:var(--a)"></div><button class="nav-btn" style="background:var(--a)" id="nextA" onclick="changeSlide('A',1)">下一頁</button></div></div>
<div id="unitB" class="view"><div class="slide-topbar"><button class="back-btn" style="color:var(--b)" onclick="goLobby()">← 回大廳</button><div class="topbar-right"><span class="slide-counter" id="counterB"></span><button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ 全螢幕</button></div></div><div class="slide-stage" id="stageB"></div><div class="slide-nav"><button class="nav-btn" style="background:var(--b)" id="prevB" onclick="changeSlide('B',-1)">上一頁</button><div class="dots" id="dotsB" style="color:var(--b)"></div><button class="nav-btn" style="background:var(--b)" id="nextB" onclick="changeSlide('B',1)">下一頁</button></div></div>
</div>
<script>
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen()}
const units=[
{id:'A',color:'var(--a)',title:'勇於說出自己的想法',range:'共6堂',enabled:true},
{id:'B',color:'var(--b)',title:'讓教室變好的力量',range:'共6堂',enabled:true},
{id:'C',color:'#A97A2C',title:'給予同儕積極正向的建議',range:'共6堂',enabled:false},
{id:'D',color:'#6E5C93',title:'培養同理心',range:'共6堂',enabled:false},
{id:'E',color:'#A85842',title:'遇到事情先思考再批判',range:'共6堂',enabled:false}
];
units.forEach(u=>{const b=document.createElement('button');b.className='door';b.style.setProperty('--door-color',u.color);b.disabled=!u.enabled;b.innerHTML=`<div class="door-letter">${u.id}</div><div class="door-title">${u.title}</div><div class="door-status">${u.enabled?'':'製作中'}</div><div class="door-range">${u.range}</div>`;if(u.enabled)b.onclick=()=>enterUnit(u.id);document.getElementById('doors').appendChild(b)});
const slidesA=[
{cover:true,kicker:'A-2・故事導入',title:'消失的解謎活動',sub:'先看影片，再一起找出：當我沒有管好自己，會發生什麼事？',video:'XZDW2C3h7R0'},
{kicker:'A-2・故事',title:'小皓怎麼了？',points:['上課的時候，小皓一直很想聊天。','他常常轉過去跟同學說話。','老師只好一次又一次停下來提醒。'],frame:'想一想：<strong>「很想聊天」的時候，我可以怎麼辦？</strong>'},
{kicker:'A-2・故事',title:'糟糕！解謎活動不見了',points:['原本大家最期待「趣味邏輯解謎活動」。','可是處理秩序花了太多時間。','最後，活動只能取消。'],frame:'小小的干擾，累積起來也可能影響整個班級。'},
{kicker:'A-2・換位思考',title:'小芸為什麼失望？',points:['小芸很期待今天的解謎活動。','活動取消了，她覺得很失望。','小皓發現：<strong>我的行為，也會影響別人。</strong>'],frame:'不是只有「我」受到影響，旁邊的人也可能受到影響。'},
{kicker:'A-2・核心概念',title:'我的自由，也要尊重別人',choices:['我想聊天','同學想學習','老師正在教學','大家想一起完成活動'],frame:'<strong>尊重</strong>不是什麼都不能做，而是知道什麼時候做、什麼時候先等等。'},
{kicker:'A-2・學習權',title:'每個人都有學習的權利',points:['教室是大家一起使用的地方。','當我一直說話，可能讓別人聽不到老師。','別人的學習時間，也值得被尊重。'],frame:'一句話記住：<strong>我的自由，不應該妨礙別人的學習。</strong>'},
{kicker:'A-2・自律',title:'什麼是「自律」？',points:['我想做一件事，不代表我現在就一定要做。','我可以先停一下。','我可以把想說的話記住，等適合的時間再說。'],frame:'<strong>自律 = 管好自己，而不是管別人。</strong>'},
{kicker:'A-2・練習',title:'如果是你，你會怎麼做？',choice:true,items:[['老師正在講重要的事情','A：馬上轉過去聊天','B：先聽完，等適當時間再說'],['我突然想到一件好笑的事','A：大聲說出來','B：先記住，等下課再分享']]},
{kicker:'A-2・因果',title:'小小的行為，也會有結果',points:['一直聊天 → 老師需要停下來處理。','花時間處理秩序 → 教學時間變少。','教學時間變少 → 解謎活動可能取消。','活動取消 → 同學失望。'],frame:'<strong>我的行為 → 會帶來結果。</strong>'},
{kicker:'A-2・回顧',title:'尊重，從自律開始',points:['我可以控制自己的行為。','我可以尊重別人的學習時間。','我可以在適當的時間說話、聊天。','當大家一起遵守，就有更多時間一起玩、一起學習！'],frame:'今天帶走一句話：<strong>「先管好自己，就是一種尊重。」</strong>'}
];
const slidesB=[
{cover:true,kicker:'B-1・故事導入',title:'讓教室變好的力量',sub:'先看影片，再一起發現：我的反應，會讓事情變大，還是變小？',video:'YyOZRBsAA34'},
{kicker:'B-1・故事',title:'浩然為什麼一直插話？',points:['浩然常在老師講課時故意插話。','有時候講無關的怪話，想吸引大家注意。','有人笑、有人罵，他都得到「大家在看我」的感覺。'],frame:'想被注意很正常，但是<strong>用什麼方法被注意</strong>很重要。'},
{kicker:'B-1・故事',title:'大家的反應，讓事情變大',cause:[['浩然插話','同學笑、接話、斥責'],['同學有反應','浩然得到更多注意'],['浩然更想被注意','課堂一次又一次被打斷']]},
{kicker:'B-1・轉折',title:'子岳說：「不要理他。」',points:['自然課時，浩然又故意插話。','子岳提醒大家：不要理他。','彥霆和同學們選擇沉默、專心看老師。'],frame:'這一次，浩然沒有得到想要的注意。'},
{kicker:'B-1・發現',title:'事情真的會變小！',points:['沒有人接話。','沒有人起鬨。','浩然發現沒有預期的回應。','他的聲音慢慢小了下來。'],frame:'<strong>我們怎麼回應，會影響事情接下來怎麼發展。</strong>'},
{kicker:'B-1・團隊責任',title:'班級是一個團隊',points:['教室裡每個人的反應都很重要。','有人起鬨，事情可能越來越大。','大家冷靜、專心，事情比較容易停下來。'],frame:'<strong>維護學習環境，不只是老師一個人的責任。</strong>'},
{kicker:'B-1・智慧選擇',title:'遇到干擾，我可以怎麼做？',choice:true,items:[['同學故意講怪話','A：跟著笑、接話','B：不跟著起鬨，繼續學習'],['同學想吸引大家注意','A：一直回應他','B：不給錯誤行為更多注意']]},
{kicker:'B-1・正向關注',title:'想被注意，可以用好方法',points:['舉手發言。','熱心幫助同學。','認真完成自己的工作。','用幽默但不打擾別人的方式分享。'],frame:'<strong>想被看見沒有錯，選對方法才是真正的力量。</strong>'},
{kicker:'B-1・生活小教室',title:'安心學習，需要大家一起守護',points:['每個人都有安心學習的權利。','不要因為好笑，就跟著起鬨。','不要用生氣的回應餵大干擾。','選擇安靜、穩定、正向的反應。'],frame:'真正有影響力的人，是能讓大家一起變好的人。'},
{kicker:'B-1・回顧',title:'今天我學會：我的反應很有力量',points:['我可以不跟著起鬨。','我可以選擇不給錯誤行為更多注意。','我可以用正向的方法獲得關注。','我也可以幫助班級維持好的學習氣氛。'],frame:'今天帶走一句話：<strong>「我的反應，可以讓事情變小，也可以讓班級變好。」</strong>'}
];
let current={A:0,B:0};
function enterUnit(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('unit'+id).classList.add('active');current[id]=0;renderUnit(id)}
function goLobby(){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('lobby').classList.add('active')}
function renderUnit(id){const slides=id==='A'?slidesA:slidesB;const color=id==='A'?'var(--a)':'var(--b)';const stage=document.getElementById('stage'+id);stage.innerHTML='';slides.forEach((s,i)=>{const d=document.createElement('div');d.className='slide'+(i===current[id]?' active':'')+(s.cover?' unit-cover':'')+(s.video?' video-slide':'');let h=`<p class="slide-kicker" style="color:${color}">${s.kicker}</p><h1 class="slide-title">${s.title}</h1>`;if(s.video){h+=`<p class="slide-sub">${s.sub}</p><div class="video-wrap"><iframe src="https://www.youtube.com/embed/${s.video}?rel=0" title="${s.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="video-note">▶ 直接在這一頁播放影片，不需要另外開 YouTube。</div>`}else if(s.choice){h+=s.items.map(x=>`<div class="choice-card"><strong>情境：</strong>${x[0]}<br>🅰️ ${x[1]}<br>🅱️ ${x[2]}</div>`).join('')+`<div class="slide-frame" style="border-color:${color}">想一想：哪一個選擇比較能幫助大家學習？</div>`}else if(s.choices){h+=`<p class="highlight" style="color:${color}">${s.choices.join('　＋　')}</p><div class="slide-frame">${s.frame}</div>`}else if(s.cause){h+=`<div class="cause-grid">${s.cause.map(x=>`<div class="cause-row"><span>${x[0]}</span><span class="arrow" style="color:${color}">→</span><span>${x[1]}</span></div>`).join('')}</div>`}else{if(s.points)h+=`<ul class="slide-points" style="color:${color}">${s.points.map(p=>`<li>${p}</li>`).join('')}</ul>`;if(s.frame)h+=`<div class="slide-frame">${s.frame}</div>`}d.innerHTML=h;stage.appendChild(d)};document.getElementById('counter'+id).textContent=`${current[id]+1} / ${slides.length}`;document.getElementById('prev'+id).disabled=current[id]===0;document.getElementById('next'+id).disabled=current[id]===slides.length-1;const dots=document.getElementById('dots'+id);dots.innerHTML='';slides.forEach((_,i)=>{const x=document.createElement('div');x.className='dot'+(i===current[id]?' current':'');dots.appendChild(x)})}
function changeSlide(id,dir){const slides=id==='A'?slidesA:slidesB;const n=current[id]+dir;if(n<0||n>=slides.length)return;current[id]=n;renderUnit(id)}
document.addEventListener('keydown',e=>{const active=document.querySelector('.view.active');if(!active||!/^unit[A-B]$/.test(active.id))return;const id=active.id.slice(-1);if(e.key==='ArrowRight')changeSlide(id,1);if(e.key==='ArrowLeft')changeSlide(id,-1);if(e.key==='Escape')goLobby()});
window.addEventListener('resize',()=>{const active=document.querySelector('.view.active');if(active&&/^unit[A-B]$/.test(active.id))renderUnit(active.id)});
</script>
</body>
</html>
