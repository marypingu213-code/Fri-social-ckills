<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社會技巧教室</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
:root{--bg:#F5F6F4;--ink:#23282B;--soft:#5B6469;--line:#D8DCDA;--card:#FFF;--a:#3E6690;--a-bg:#EAF0F5}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;overflow:hidden}#app{width:100vw;height:100vh;position:relative}.view{position:absolute;inset:0;display:none;flex-direction:column}.view.active{display:flex}
#lobby{padding:5vh 6vw;justify-content:center;gap:4vh}.lobby-eyebrow{font-size:1.5vw;color:var(--soft);margin:0 0 .8vh}.lobby-title{font-size:4.4vw;font-weight:900;margin:0}.doors{display:flex;gap:1.6vw}.door{flex:1;background:var(--card);border:1px solid var(--line);border-left:.6vw solid var(--door-color);border-radius:4px;padding:2.6vh 1.6vw;display:flex;flex-direction:column;gap:1.4vh;cursor:pointer;text-align:left;font-family:inherit}.door:disabled{cursor:default;opacity:.55}.door-letter{font-size:3.6vw;font-weight:900;color:var(--door-color);line-height:1}.door-title{font-size:1.8vw;font-weight:700;line-height:1.35}.door-range,.door-status{font-size:1.25vw;color:var(--soft)}.door-range{margin-top:auto}
#unitA{background:var(--a-bg)}.slide-topbar{display:flex;align-items:center;justify-content:space-between;padding:2.6vh 3.4vw 0}.back-btn,.fullscreen-btn{font-family:inherit;font-size:1.3vw;background:none;border:1px solid var(--line);border-radius:3px;padding:.8vh 1.4vw;cursor:pointer}.back-btn{color:var(--a);border-color:var(--a)}.topbar-right{display:flex;align-items:center;gap:1.4vw}.slide-counter{font-size:1.3vw;color:var(--soft)}
.slide-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:2vh 5vw 2vh;overflow:hidden}.slide{display:none;width:100%;max-width:72vw}.slide.active{display:block}.slide-kicker{font-size:1.5vw;color:var(--a);font-weight:700;margin:0 0 1.2vh}.slide-title{font-size:3.5vw;font-weight:900;line-height:1.25;margin:0 0 2vh}.unit-cover .slide-title{font-size:4.4vw}.slide-sub,.slide-intro{font-size:1.8vw;color:var(--soft);line-height:1.45}.video-slide{max-width:72vw}.video-wrap{margin:1.5vh auto 0;background:#000;border-radius:8px;overflow:hidden;width:min(72vw,calc((100vh - 35vh)*16/9));max-width:100%;aspect-ratio:16/9;box-shadow:0 8px 28px rgba(35,40,43,.12)}.video-wrap iframe{width:100%;height:100%;border:0;display:block}.video-note{margin-top:.7vh;font-size:1.05vw;color:var(--soft);text-align:center}.slide-points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.8vh}.slide-points li{font-size:1.95vw;line-height:1.55;padding-left:1.8vw;position:relative}.slide-points li:before{content:' ';position:absolute;left:0;top:.75em;width:.9vw;height:2px;background:var(--a)}.slide-frame{margin-top:3vh;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2vh 2vw;font-size:1.8vw;line-height:1.55}.choice-grid{display:flex;flex-wrap:wrap;gap:1.2vw}.chip{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:1.7vh 2vw;font-size:1.8vw;font-weight:700;min-width:13vw;text-align:center}.choice-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2vh 2vw;margin:1.2vh 0;font-size:1.8vw;line-height:1.5}.choice-card strong{color:var(--a)}.arrow{font-size:2vw;text-align:center;color:var(--a);margin:.6vh}.highlight{font-size:2.4vw;font-weight:900;color:var(--a);margin:1vh 0 2vh}.slide-nav{display:flex;align-items:center;justify-content:center;gap:2vw;padding-bottom:3vh}.nav-btn{font-family:inherit;font-size:1.5vw;font-weight:700;color:#fff;background:var(--a);border:0;border-radius:3px;padding:1.2vh 2.4vw;cursor:pointer}.nav-btn:disabled{background:var(--line);color:var(--soft)}.dots{display:flex;gap:.6vw}.dot{width:.7vw;height:.7vw;border-radius:50%;background:var(--line)}.dot.current{background:var(--a)}
@media(max-width:900px){.slide-title{font-size:6vw}.unit-cover .slide-title{font-size:7vw}.slide-kicker{font-size:3vw}.slide-sub,.slide-intro,.slide-frame,.choice-card{font-size:3vw}.slide-points li{font-size:3.2vw}.video-wrap{width:min(90vw,calc((100vh - 30vh)*16/9))}.video-note{font-size:2.2vw}.nav-btn,.back-btn,.fullscreen-btn{font-size:2.5vw}.slide-counter{font-size:2.5vw}}
</style></head><body><div id="app">
<div id="lobby" class="view active"><div><p class="lobby-eyebrow">社會技巧課程</p><h1 class="lobby-title">選擇今天要上的單元</h1></div><div class="doors" id="doors"></div><button class="fullscreen-btn" style="position:absolute;top:2.6vh;right:3.4vw" onclick="toggleFullscreen()">⛶ 全螢幕</button></div>
<div id="unitA" class="view"><div class="slide-topbar"><button class="back-btn" onclick="goLobby()">← 回大廳</button><div class="topbar-right"><span class="slide-counter" id="counterA"></span><button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ 全螢幕</button></div></div><div class="slide-stage" id="stageA"></div><div class="slide-nav"><button class="nav-btn" id="prevA" onclick="changeSlide(-1)">上一頁</button><div class="dots" id="dotsA"></div><button class="nav-btn" id="nextA" onclick="changeSlide(1)">下一頁</button></div></div></div>
<script>function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen()}</script>
<script>
const units=[{id:'A',color:'var(--a)',title:'勇於說出自己的想法',range:'共6堂',enabled:true},{id:'B',color:'#3E8272',title:'分享自己的心情',range:'共6堂',enabled:false},{id:'C',color:'#A97A2C',title:'給予同儕積極正向的建議',range:'共6堂',enabled:false},{id:'D',color:'#6E5C93',title:'培養同理心',range:'共6堂',enabled:false},{id:'E',color:'#A85842',title:'遇到事情先思考再批判',range:'共6堂',enabled:false}];
units.forEach(u=>{let b=document.createElement('button');b.className='door';b.style.setProperty('--door-color',u.color);b.disabled=!u.enabled;b.innerHTML=`<div class="door-letter">${u.id}</div><div class="door-title">${u.title}</div><div class="door-status">${u.enabled?'':'製作中'}</div><div class="door-range">${u.range}</div>`;if(u.enabled)b.onclick=()=>enterUnit(u.id);document.getElementById('doors').appendChild(b)});
function enterUnit(id){document.getElementById('lobby').classList.remove('active');document.getElementById('unit'+id).classList.add('active');currentA=0;renderSlideA()}function goLobby(){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('lobby').classList.add('active')}
const slidesA=[
{cover:true,kicker:'A-2・故事導入',title:'消失的解謎活動',sub:'先看影片，再一起找出：當我沒有管好自己，會發生什麼事？',video:true},
{kicker:'A-2・故事',title:'小皓怎麼了？',points:['上課的時候，小皓一直很想聊天。','他常常轉過去跟同學說話。','老師只好一次又一次停下來提醒。'],frame:'想一想：<strong>「很想聊天」的時候，我可以怎麼辦？</strong>'},
{kicker:'A-2・故事',title:'糟糕！解謎活動不見了',points:['今天原本有大家最期待的「趣味邏輯解謎活動」。','可是因為處理秩序花了太多時間。','最後，活動只能取消。'],frame:'小皓原本只是想聊天，沒想到卻影響了整個班級。'},
{kicker:'A-2・換位思考',title:'小芸為什麼失望？',points:['小芸很期待今天的解謎活動。','可是活動被取消了，她覺得很失望。','小皓這時候才發現：<strong>我的行為，也會影響別人。</strong>'],frame:'不是只有「我」受到影響，旁邊的人也可能受到影響。'},
{kicker:'A-2・核心概念',title:'我的自由，也要尊重別人',choices:['我想聊天','同學想學習','老師正在教學','大家想一起完成活動'],frame:'<strong>尊重</strong>不是「什麼都不能做」，而是知道什麼時候做、什麼時候先等等。'},
{kicker:'A-2・學習權',title:'每個人都有學習的權利',points:['教室是大家一起使用的地方。','當我一直說話，可能讓別人聽不到老師。','別人的學習時間，也值得被尊重。'],frame:'一句話記住：<strong>我的自由，不應該妨礙別人的學習。</strong>'},
{kicker:'A-2・自律',title:'什麼是「自律」？',points:['我想做一件事，不代表我現在就一定要做。','我可以先停一下。','我可以把想說的話記住，等適合的時間再說。'],frame:'<strong>自律 = 管好自己，而不是管別人。</strong>'},
{kicker:'A-2・練習',title:'如果是你，你會怎麼做？',choice:true,items:[['老師正在講重要的事情','A：馬上轉過去聊天','B：先聽完，等適當時間再說'],['我突然想到一件好笑的事','A：大聲說出來','B：先記住，等下課再分享']]},
{kicker:'A-2・因果',title:'小小的行為，也會有結果',points:['一直聊天 → 老師需要停下來處理。','花時間處理秩序 → 教學時間變少。','教學時間變少 → 解謎活動可能取消。','活動取消 → 同學失望。'],frame:'<strong>我的行為 → 會帶來結果。</strong>'},
{kicker:'A-2・回顧',title:'尊重，從自律開始',points:['我可以控制自己的行為。','我可以尊重別人的學習時間。','我可以在適當的時間說話、聊天。','當大家一起遵守，才有更多時間一起玩、一起學習！'],frame:'今天帶走一句話：<strong>「先管好自己，就是一種尊重。」</strong>'}
];
let currentA=0;
function renderSlideA(){let stage=document.getElementById('stageA');stage.innerHTML='';slidesA.forEach((s,i)=>{let d=document.createElement('div');d.className='slide'+(i===currentA?' active':'')+(s.cover?' unit-cover':'')+(s.video?' video-slide':'');let h=`<p class="slide-kicker">${s.kicker}</p><h1 class="slide-title">${s.title}</h1>`;if(s.video)h+=`<p class="slide-sub">${s.sub}</p><div class="video-wrap"><iframe src="https://www.youtube.com/embed/XZDW2C3h7R0?rel=0" title="消失的解謎活動——學習自律與尊重" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="video-note">▶ 直接在這一頁播放影片，不需要另外開 YouTube。</div>`;else if(s.choice)h+=s.items.map(x=>`<div class="choice-card"><strong>情境：</strong>${x[0]}<br>🅰️ ${x[1]}<br>🅱️ ${x[2]}</div>`).join('')+`<div class="slide-frame">想一想：哪一個選擇比較能尊重自己，也尊重別人？</div>`;else if(s.choices)h+=`<p class="highlight">${s.choices.join('　＋　')}</p><div class="slide-frame">${s.frame}</div>`;else{if(s.points)h+=`<ul class="slide-points">${s.points.map(p=>`<li>${p}</li>`).join('')}</ul>`;if(s.frame)h+=`<div class="slide-frame">${s.frame}</div>`}d.innerHTML=h;stage.appendChild(d)});document.getElementById('counterA').textContent=`${currentA+1} / ${slidesA.length}`;document.getElementById('prevA').disabled=currentA===0;document.getElementById('nextA').disabled=currentA===slidesA.length-1;let dots=document.getElementById('dotsA');dots.innerHTML='';slidesA.forEach((_,i)=>{let x=document.createElement('div');x.className='dot'+(i===currentA?' current':'');dots.appendChild(x)})}
function changeSlide(dir){let n=currentA+dir;if(n<0||n>=slidesA.length)return;currentA=n;renderSlideA()}document.addEventListener('keydown',e=>{if(!document.getElementById('unitA').classList.contains('active'))return;if(e.key==='ArrowRight')changeSlide(1);if(e.key==='ArrowLeft')changeSlide(-1);if(e.key==='Escape')goLobby()});
</script></body></html>
