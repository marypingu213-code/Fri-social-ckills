<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>社會技巧教室</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
:root{--bg:#F5F6F4;--ink:#23282B;--soft:#5B6469;--line:#D8DCDA;--card:#FFF;--a:#3E6690;--a-bg:#EAF0F5;--b:#3E8272;--b-bg:#E9F4F0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;overflow:hidden}button{font-family:inherit}.view{position:absolute;inset:0;display:none;flex-direction:column}.view.active{display:flex}
#lobby{padding:5vh 6vw;justify-content:center;gap:4vh}.lobby-eyebrow{font-size:1.5vw;color:var(--soft);margin:0 0 1vh}.lobby-title{font-size:4.4vw;font-weight:900;margin:0}.doors{display:flex;gap:1.5vw;width:100%}.door{flex:1;min-height:20vh;background:#fff;border:1px solid var(--line);border-left:8px solid var(--door-color);border-radius:8px;padding:2.5vh 1.5vw;display:flex;flex-direction:column;gap:1vh;cursor:pointer;text-align:left}.door:disabled{cursor:default;opacity:.5}.door-letter{font-size:3.5vw;font-weight:900;color:var(--door-color)}.door-title{font-size:1.7vw;font-weight:700;line-height:1.35}.door-range,.door-status{font-size:1.2vw;color:var(--soft)}.door-range{margin-top:auto}
#unitA{background:var(--a-bg)}#unitB{background:var(--b-bg)}.top{height:9vh;display:flex;align-items:center;justify-content:space-between;padding:1.8vh 3.4vw}.top-left{display:flex;align-items:center;gap:1vw}.back,.full{font-size:1.3vw;background:#fff;border:1px solid var(--line);border-radius:5px;padding:.8vh 1.3vw;cursor:pointer}.count{font-size:1.3vw;color:var(--soft)}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:1vh 5vw}.slide{display:none;width:100%;max-width:74vw}.slide.active{display:block}.kicker{font-size:1.45vw;font-weight:700;margin:0 0 1vh}.title{font-size:3.5vw;line-height:1.2;font-weight:900;margin:0 0 2vh}.sub{font-size:1.8vw;color:var(--soft);line-height:1.45}.points{margin:0;padding:0;list-style:none;display:grid;gap:1.4vh}.points li{font-size:1.9vw;line-height:1.5;padding-left:1.6vw;position:relative}.points li:before{content:'';position:absolute;left:0;top:.7em;width:.8vw;height:3px;background:currentColor}.frame{margin-top:2.5vh;background:#fff;border:1px solid var(--line);border-radius:8px;padding:1.8vh 1.8vw;font-size:1.75vw;line-height:1.5}.chips{display:flex;flex-wrap:wrap;gap:1vw;margin-top:1vh}.chip{background:#fff;border:2px solid var(--line);border-radius:10px;padding:1.5vh 1.6vw;font-size:1.7vw;font-weight:700}.choice{background:#fff;border:1px solid var(--line);border-radius:8px;padding:1.5vh 1.6vw;margin:1vh 0;font-size:1.65vw;line-height:1.5}.cause{display:grid;gap:1vh}.cause div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:1.4vh 1.5vw;font-size:1.7vw}.video-slide{max-width:76vw}.video{width:min(76vw,calc((100vh - 31vh)*16/9));max-width:100%;aspect-ratio:16/9;margin:1.2vh auto 0;background:#000;border-radius:9px;overflow:hidden}.video iframe{width:100%;height:100%;border:0}.note{text-align:center;font-size:1vw;color:var(--soft);margin-top:.5vh}.nav{height:11vh;display:flex;align-items:center;justify-content:center;gap:2vw}.nav button{font-size:1.4vw;font-weight:700;border:0;border-radius:6px;padding:1.1vh 2.3vw;color:#fff;cursor:pointer}.nav button:disabled{background:var(--line)!important;color:var(--soft)}.dots{display:flex;gap:.6vw}.dot{width:.65vw;height:.65vw;border-radius:50%;background:var(--line)}.dot.on{background:currentColor}
@media(max-width:900px){.lobby-title{font-size:7vw}.doors{flex-wrap:wrap}.door{min-width:28vw}.door-letter{font-size:6vw}.door-title{font-size:3vw}.door-range,.door-status{font-size:2vw}.title{font-size:6vw}.kicker{font-size:2.8vw}.sub,.frame,.choice{font-size:3vw}.points li{font-size:3.2vw}.chip{font-size:3vw}.cause div{font-size:2.8vw}.back,.full,.count,.nav button{font-size:2.4vw}.video{width:min(90vw,calc((100vh - 28vh)*16/9))}.note{font-size:2vw}}
</style>
</head>
<body>
<div id="lobby" class="view active">
 <div><p class="lobby-eyebrow">社會技巧課程</p><h1 class="lobby-title">選擇今天要上的單元</h1></div>
 <div class="doors" id="doors"></div>
 <button class="full" style="position:absolute;right:3.4vw;top:2.5vh" onclick="toggleFull()">⛶ 全螢幕</button>
</div>
<div id="unitA" class="view"><div class="top"><div class="top-left"><button class="back" style="color:var(--a)" onclick="backHome()">← 回大廳</button></div><div><span class="count" id="countA"></span> <button class="full" onclick="toggleFull()">⛶ 全螢幕</button></div></div><div class="stage" id="stageA"></div><div class="nav"><button id="prevA" style="background:var(--a)" onclick="move('A',-1)">上一頁</button><div class="dots" id="dotsA" style="color:var(--a)"></div><button id="nextA" style="background:var(--a)" onclick="move('A',1)">下一頁</button></div></div>
<div id="unitB" class="view"><div class="top"><div class="top-left"><button class="back" style="color:var(--b)" onclick="backHome()">← 回大廳</button></div><div><span class="count" id="countB"></span> <button class="full" onclick="toggleFull()">⛶ 全螢幕</button></div></div><div class="stage" id="stageB"></div><div class="nav"><button id="prevB" style="background:var(--b)" onclick="move('B',-1)">上一頁</button><div class="dots" id="dotsB" style="color:var(--b)"></div><button id="nextB" style="background:var(--b)" onclick="move('B',1)">下一頁</button></div></div>
<script>
function toggleFull(){if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(function(){});}else{document.exitFullscreen();}}
function backHome(){document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});document.getElementById('lobby').classList.add('active');}
var units=[
 {id:'A',color:'var(--a)',title:'勇於說出自己的想法',range:'共6堂',on:true},
 {id:'B',color:'var(--b)',title:'讓教室變好的力量',range:'共6堂',on:true},
 {id:'C',color:'#A97A2C',title:'給予同儕積極正向的建議',range:'共6堂',on:false},
 {id:'D',color:'#6E5C93',title:'培養同理心',range:'共6堂',on:false},
 {id:'E',color:'#A85842',title:'遇到事情先思考再批判',range:'共6堂',on:false}
];
units.forEach(function(u){var b=document.createElement('button');b.className='door';b.style.setProperty('--door-color',u.color);b.disabled=!u.on;b.innerHTML='<div class="door-letter">'+u.id+'</div><div class="door-title">'+u.title+'</div><div class="door-status">'+(u.on?'':'製作中')+'</div><div class="door-range">'+u.range+'</div>';if(u.on){b.onclick=function(){openUnit(u.id);};}document.getElementById('doors').appendChild(b);});
</script>
<script>
var slidesA=[
 {video:'XZDW2C3h7R0',k:'A-2・故事導入',t:'消失的解謎活動',s:'先看影片，再一起找出：當我沒有管好自己，會發生什麼事？'},
 {k:'A-2・故事',t:'小皓怎麼了？',p:['上課的時候，小皓一直很想聊天。','他常常轉過去跟同學說話。','老師只好一次又一次停下來提醒。'],f:'想一想：<strong>「很想聊天」的時候，我可以怎麼辦？</strong>'},
 {k:'A-2・故事',t:'糟糕！解謎活動不見了',p:['原本大家最期待「趣味邏輯解謎活動」。','可是處理秩序花了太多時間。','最後，活動只能取消。'],f:'小小的干擾，累積起來也可能影響整個班級。'},
 {k:'A-2・換位思考',t:'小芸為什麼失望？',p:['小芸很期待今天的解謎活動。','活動取消了，她覺得很失望。','小皓發現：<strong>我的行為，也會影響別人。</strong>'],f:'不是只有「我」受到影響，旁邊的人也可能受到影響。'},
 {k:'A-2・核心概念',t:'我的自由，也要尊重別人',chips:['我想聊天','同學想學習','老師正在教學','大家想一起完成活動'],f:'<strong>尊重</strong>不是什麼都不能做，而是知道什麼時候做、什麼時候先等等。'},
 {k:'A-2・學習權',t:'每個人都有學習的權利',p:['教室是大家一起使用的地方。','當我一直說話，可能讓別人聽不到老師。','別人的學習時間，也值得被尊重。'],f:'一句話記住：<strong>我的自由，不應該妨礙別人的學習。</strong>'},
 {k:'A-2・自律',t:'什麼是「自律」？',p:['我想做一件事，不代表我現在就一定要做。','我可以先停一下。','我可以把想說的話記住，等適合的時間再說。'],f:'<strong>自律 = 管好自己，而不是管別人。</strong>'},
 {k:'A-2・練習',t:'如果是你，你會怎麼做？',c:[['老師正在講重要的事情','A：馬上轉過去聊天','B：先聽完，等適當時間再說'],['我突然想到一件好笑的事','A：大聲說出來','B：先記住，等下課再分享']]},
 {k:'A-2・因果',t:'小小的行為，也會有結果',p:['一直聊天 → 老師需要停下來處理。','花時間處理秩序 → 教學時間變少。','教學時間變少 → 解謎活動可能取消。','活動取消 → 同學失望。'],f:'<strong>我的行為 → 會帶來結果。</strong>'},
 {k:'A-2・回顧',t:'尊重，從自律開始',p:['我可以控制自己的行為。','我可以尊重別人的學習時間。','我可以在適當的時間說話、聊天。','當大家一起遵守，就有更多時間一起玩、一起學習！'],f:'今天帶走一句話：<strong>「先管好自己，就是一種尊重。」</strong>'}
];
var slidesB=[
 {video:'YyOZRBsAA34',k:'B-1・故事導入',t:'讓教室變好的力量',s:'先看影片，再一起發現：我的反應，會讓事情變大，還是變小？'},
 {k:'B-1・故事',t:'浩然為什麼一直插話？',p:['浩然常在老師講課時故意插話。','有時候講無關的怪話，想吸引大家注意。','有人笑、有人罵，他都得到「大家在看我」的感覺。'],f:'想被注意很正常，但是<strong>用什麼方法被注意</strong>很重要。'},
 {k:'B-1・故事',t:'大家的反應，讓事情變大',cause:['浩然插話 → 同學笑、接話、斥責','同學有反應 → 浩然得到更多注意','浩然更想被注意 → 課堂一次又一次被打斷']},
 {k:'B-1・轉折',t:'子岳說：「不要理他。」',p:['自然課時，浩然又故意插話。','子岳提醒大家：不要理他。','彥霆和同學們選擇沉默、專心看老師。'],f:'這一次，浩然沒有得到想要的注意。'},
 {k:'B-1・發現',t:'事情真的會變小！',p:['沒有人接話。','沒有人起鬨。','浩然發現沒有預期的回應。','他的聲音慢慢小了下來。'],f:'<strong>我們怎麼回應，會影響事情接下來怎麼發展。</strong>'},
 {k:'B-1・團隊責任',t:'班級是一個團隊',p:['教室裡每個人的反應都很重要。','有人起鬨，事情可能越來越大。','大家冷靜、專心，事情比較容易停下來。'],f:'<strong>維護學習環境，不只是老師一個人的責任。</strong>'},
 {k:'B-1・智慧選擇',t:'遇到干擾，我可以怎麼做？',c:[['同學故意講怪話','A：跟著笑、接話','B：不跟著起鬨，繼續學習'],['同學想吸引大家注意','A：一直回應他','B：不給錯誤行為更多注意']]},
 {k:'B-1・正向關注',t:'想被注意，可以用好方法',p:['舉手發言。','熱心幫助同學。','認真完成自己的工作。','用幽默但不打擾別人的方式分享。'],f:'<strong>想被看見沒有錯，選對方法才是真正的力量。</strong>'},
 {k:'B-1・生活小教室',t:'安心學習，需要大家一起守護',p:['每個人都有安心學習的權利。','不要因為好笑，就跟著起鬨。','不要用生氣的回應餵大干擾。','選擇安靜、穩定、正向的反應。'],f:'真正有影響力的人，是能讓大家一起變好的人。'},
 {k:'B-1・回顧',t:'我的反應很有力量',p:['我可以不跟著起鬨。','我可以選擇不給錯誤行為更多注意。','我可以用正向的方法獲得關注。','我也可以幫助班級維持好的學習氣氛。'],f:'今天帶走一句話：<strong>「我的反應，可以讓事情變小，也可以讓班級變好。」</strong>'}
];
var pos={A:0,B:0};
function openUnit(id){document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});document.getElementById('unit'+id).classList.add('active');pos[id]=0;render(id);}
function render(id){var list=id==='A'?slidesA:slidesB;var color=id==='A'?'var(--a)':'var(--b)';var stage=document.getElementById('stage'+id);stage.innerHTML='';list.forEach(function(x,i){var d=document.createElement('div');d.className='slide'+(i===pos[id]?' active':'')+(x.video?' video-slide':'');var html='<p class="kicker" style="color:'+color+'">'+x.k+'</p><h1 class="title">'+x.t+'</h1>';if(x.video){html+='<p class="sub">'+x.s+'</p><div class="video"><iframe src="https://www.youtube.com/embed/'+x.video+'?rel=0" title="'+x.t+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="note">▶ 直接在簡報中播放影片</div>';}else if(x.c){x.c.forEach(function(q){html+='<div class="choice"><strong>情境：</strong>'+q[0]+'<br>🅰️ '+q[1]+'<br>🅱️ '+q[2]+'</div>';});html+='<div class="frame">想一想：哪一個選擇比較能幫助大家學習？</div>';}else if(x.chips){html+='<div class="chips">';x.chips.forEach(function(ch){html+='<div class="chip">'+ch+'</div>';});html+='</div><div class="frame">'+x.f+'</div>';}else if(x.cause){html+='<div class="cause">';x.cause.forEach(function(row){html+='<div>'+row+'</div>';});html+='</div>';}else{if(x.p){html+='<ul class="points" style="color:'+color+'">';x.p.forEach(function(p){html+='<li>'+p+'</li>';});html+='</ul>';}if(x.f){html+='<div class="frame">'+x.f+'</div>';}}d.innerHTML=html;stage.appendChild(d);});document.getElementById('count'+id).textContent=(pos[id]+1)+' / '+list.length;document.getElementById('prev'+id).disabled=pos[id]===0;document.getElementById('next'+id).disabled=pos[id]===list.length-1;var dots=document.getElementById('dots'+id);dots.innerHTML='';list.forEach(function(_,i){var dot=document.createElement('span');dot.className='dot'+(i===pos[id]?' on':'');dots.appendChild(dot);});}
function move(id,dir){var list=id==='A'?slidesA:slidesB;var n=pos[id]+dir;if(n<0||n>=list.length)return;pos[id]=n;render(id);}
document.addEventListener('keydown',function(e){var active=document.querySelector('.view.active');if(!active||active.id==='lobby')return;var id=active.id.slice(-1);if(e.key==='ArrowRight')move(id,1);if(e.key==='ArrowLeft')move(id,-1);if(e.key==='Escape')backHome();});
window.addEventListener('resize',function(){var active=document.querySelector('.view.active');if(active&&active.id!=='lobby')render(active.id);});
</script>
</body>
</html>
